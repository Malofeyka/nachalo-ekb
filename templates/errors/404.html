{% extends "index.html" %}

{% block title %}Страница не найдена (404){% endblock %}

{% block content %}
<section class="error-section">
    <div class="container">
        <div class="error-content">
            <h1 class="error-code">404</h1>
            <h2 class="error-title">Страница не найдена</h2>
            <p class="error-text">
                К сожалению, страница, которую вы ищете, не существует или была перемещена.
            </p>
            <div class="error-actions">
                <a href="{{ url_for('index') }}" class="btn btn-primary">
                    <i class="fa fa-home"></i> На главную
                </a>
                <a href="{{ url_for('contacts') }}" class="btn btn-outline">
                    <i class="fa fa-envelope"></i> Связаться с нами
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
